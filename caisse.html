<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caisse — Halloween Party</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f0f0f0;font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;}

/* PIN */
.pin-screen{position:fixed;top:0;left:0;right:0;bottom:0;background:#1a1a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;}
.pin-title{font-size:1.4rem;font-weight:700;color:#fff;letter-spacing:2px;margin-bottom:4px;}
.pin-sub{font-size:0.8rem;color:#aaa;margin-bottom:24px;}
.pin-dots{display:flex;gap:12px;margin-bottom:20px;}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid #555;background:transparent;transition:all 0.2s;}
.pin-dot.filled{background:#27ae60;border-color:#27ae60;}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:200px;}
.pin-btn{padding:16px;background:#2a2a2a;border:1px solid #333;border-radius:8px;font-size:1.3rem;font-weight:600;color:#fff;cursor:pointer;text-align:center;transition:all 0.15s;}
.pin-btn:active{background:#27ae60;color:#fff;}
.pin-err{color:#e74c3c;font-size:0.78rem;margin-top:10px;min-height:18px;}

/* HEADER */
.header{background:#27ae60;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
.header-title{font-size:1rem;font-weight:700;color:#fff;}
.header-sub{font-size:0.65rem;color:rgba(255,255,255,0.75);margin-top:1px;}
.header-right{display:flex;gap:6px;}
.btn-refresh{background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.4);color:#fff;border-radius:6px;padding:5px 10px;font-size:0.72rem;font-weight:700;cursor:pointer;}
.btn-lock{background:transparent;border:1px solid rgba(255,255,255,0.3);color:rgba(255,255,255,0.8);border-radius:6px;padding:5px 10px;font-size:0.72rem;cursor:pointer;}

/* COMPTEUR */
.cpt-bar{background:#fff;border-bottom:1px solid #e0e0e0;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;}
.cpt-label{font-size:0.72rem;color:#888;text-transform:uppercase;letter-spacing:1px;}
.cpt-num{font-size:1.4rem;font-weight:800;color:#27ae60;}

/* LISTE COMMANDES PRETES */
.liste{padding:8px;display:flex;flex-direction:column;gap:8px;padding-bottom:50px;}

.cmd-card{
  background:#fff;border-radius:10px;
  border:0.5px solid #e0e0e0;
  border-left:5px solid #27ae60;
  overflow:hidden;
}

/* IDENTITE CLIENT */
.cmd-identite{
  display:grid;grid-template-columns:1fr auto;
  align-items:center;
  padding:12px 14px 10px;
  border-bottom:1px solid #f0f0f0;
  background:#f9fff9;
}
.cmd-id-left{}
.cmd-num{font-size:2rem;font-weight:800;color:#1a1a1a;line-height:1;}
.cmd-prenom{font-size:1rem;font-weight:600;color:#27ae60;margin-top:2px;}
.cmd-total-big{
  font-size:2rem;font-weight:800;
  color:#1a1a1a;text-align:right;
}
.cmd-total-label{font-size:0.65rem;color:#aaa;text-align:right;text-transform:uppercase;letter-spacing:1px;}

/* DETAIL COMMANDE */
.cmd-detail{padding:10px 14px;}
.detail-title{font-size:0.65rem;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.art-ligne{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.art-img{width:32px;height:30px;object-fit:contain;border-radius:3px;}
.art-info{}
.art-name{font-size:0.82rem;font-weight:600;color:#1a1a1a;}
.art-opts{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px;}
.opt{font-size:0.65rem;font-weight:600;padding:1px 5px;border-radius:3px;border:0.5px solid;}
.opt-k{background:#ffe0e0;color:#990000;border-color:#ffaaaa;}
.opt-m{background:#fffbe0;color:#775500;border-color:#ffe066;}
.opt-mo{background:#fff3cc;color:#664400;border-color:#ffd966;}
.opt-c{background:#e0f5e0;color:#1a5c00;border-color:#99dd88;}
.opt-o{background:#f0e0ff;color:#550099;border-color:#cc88ff;}
.opt-n{background:#f5e8d0;color:#5c2a00;border-color:#cc8844;}
.opt-s{background:#e8f0ff;color:#003399;border-color:#99aaff;}
.opt-def{background:#f5f5f5;color:#666;border-color:#ddd;}

/* BOUTON PAYE */
.cmd-action{padding:10px 14px;border-top:1px solid #f0f0f0;}
.btn-paye{
  width:100%;padding:14px;
  background:#27ae60;color:#fff;
  border:none;border-radius:8px;
  font-size:1rem;font-weight:700;
  letter-spacing:1px;cursor:pointer;
  transition:all 0.15s;text-transform:uppercase;
}
.btn-paye:active{background:#1a8a4a;transform:scale(0.98);}

/* VIDE */
.empty{
  text-align:center;padding:60px 20px;
  color:#bbb;font-style:italic;
}
.empty-icon{font-size:2.5rem;margin-bottom:10px;}
.empty-text{font-size:0.9rem;}

/* REFRESH BAR */
.refresh-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e0e0e0;padding:5px 10px;display:flex;align-items:center;justify-content:space-between;font-size:0.62rem;color:#aaa;}
.dot{width:6px;height:6px;border-radius:50%;background:#27ae60;display:inline-block;margin-right:4px;}
.dot.loading{background:#e67e00;animation:blink 0.5s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.2;}}
</style>
</head>
<body>

<!-- PIN -->
<div id="pin-screen" class="pin-screen">
  <div class="pin-title">CAISSE</div>
  <div class="pin-sub">Halloween Party — 31 Octobre</div>
  <div class="pin-dots">
    <div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div>
  </div>
  <div class="pin-pad">
    <div class="pin-btn" onclick="pp('1')">1</div><div class="pin-btn" onclick="pp('2')">2</div><div class="pin-btn" onclick="pp('3')">3</div>
    <div class="pin-btn" onclick="pp('4')">4</div><div class="pin-btn" onclick="pp('5')">5</div><div class="pin-btn" onclick="pp('6')">6</div>
    <div class="pin-btn" onclick="pp('7')">7</div><div class="pin-btn" onclick="pp('8')">8</div><div class="pin-btn" onclick="pp('9')">9</div>
    <div class="pin-btn" onclick="pc()" style="color:#e74c3c;">✕</div>
    <div class="pin-btn" onclick="pp('0')">0</div>
    <div class="pin-btn" onclick="pd()">⌫</div>
  </div>
  <div class="pin-err" id="pin-err"></div>
</div>

<!-- CAISSE -->
<div id="caisse" style="display:none;padding-bottom:32px;">

  <div class="header">
    <div>
      <div class="header-title">Caisse</div>
      <div class="header-sub" id="refresh-info">Chargement...</div>
    </div>
    <div class="header-right">
      <button class="btn-refresh" onclick="charger()">Actualiser</button>
      <button class="btn-lock" onclick="lock()">Verrouiller</button>
    </div>
  </div>

  <div class="cpt-bar">
    <div class="cpt-label">Commandes pretes</div>
    <div class="cpt-num" id="cpt">0</div>
  </div>

  <div class="liste" id="liste"></div>

</div>

<div class="refresh-bar">
  <span><span class="dot" id="dot"></span>Refresh 10s</span>
  <span id="refresh-time"></span>
</div>

<script>
var URL='https://script.google.com/macros/s/AKfycbxTXZ7CQYpu_mYPUUdxc0zfdDaoGGmVQl7B7BtXZrj8dGe3kSPUPZvbs_UItIduSfjc/exec';
var PIN='3110';
var pin='';
var cmds={};
var ri;
var IMGS={menu:'https://bouisbouis2-design.github.io/halloween-party/menu.png',hotdog:'https://bouisbouis2-design.github.io/halloween-party/hotdog.png',frites:'https://bouisbouis2-design.github.io/halloween-party/frites.png',crepe:'https://bouisbouis2-design.github.io/halloween-party/crepe.png'};

function pp(n){if(pin.length>=4)return;pin+=n;dots();if(pin.length===4)setTimeout(check,200);}
function pd(){pin=pin.slice(0,-1);dots();}
function pc(){pin='';dots();}
function dots(){for(var i=0;i<4;i++)document.getElementById('d'+i).classList.toggle('filled',i<pin.length);}
function check(){
  if(pin===PIN){
    document.getElementById('pin-screen').style.display='none';
    document.getElementById('caisse').style.display='block';
    charger();ri=setInterval(charger,10000);
  }else{
    document.getElementById('pin-err').textContent='Code incorrect';
    pin='';dots();setTimeout(function(){document.getElementById('pin-err').textContent='';},2000);
  }
}
function lock(){clearInterval(ri);pin='';dots();document.getElementById('pin-screen').style.display='flex';document.getElementById('caisse').style.display='none';}

async function charger(){
  var dot=document.getElementById('dot');dot.classList.add('loading');
  try{
    var r=await fetch(URL+'?action=read');
    var d=await r.json();
    if(d.status==='ok'){
      d.rows.forEach(function(row){
        var num=row[2];if(!num)return;
        var s=row[6]||'attente';
        if(!cmds[num]){cmds[num]={num:num,prenom:row[1],articles:row[3],total:row[5],heure:new Date(row[0]),statut:s,lc:false};}
        else if(!cmds[num].lc){cmds[num].statut=s;}
      });
      render();
      var now=new Date();
      var t=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
      document.getElementById('refresh-info').textContent='Mis a jour a '+t;
      document.getElementById('refresh-time').textContent=t+':'+now.getSeconds().toString().padStart(2,'0');
    }
  }catch(e){document.getElementById('refresh-info').textContent='Erreur connexion';}
  dot.classList.remove('loading');
}

function render(){
  var list=Object.values(cmds).filter(function(c){return c.statut==='pret';});
  list.sort(function(a,b){return a.heure-b.heure;});
  document.getElementById('cpt').textContent=list.length;
  var liste=document.getElementById('liste');
  liste.innerHTML='';
  if(!list.length){
    liste.innerHTML='<div class="empty"><div class="empty-icon">✓</div><div class="empty-text">Aucune commande prête pour le moment</div></div>';
    return;
  }
  list.forEach(function(c){liste.appendChild(makeCard(c));});
}

function makeCard(c){
  var div=document.createElement('div');
  div.className='cmd-card';
  div.innerHTML=
    '<div class="cmd-identite">'+
      '<div class="cmd-id-left">'+
        '<div class="cmd-num">N° '+c.num+'</div>'+
        '<div class="cmd-prenom">'+c.prenom+'</div>'+
      '</div>'+
      '<div>'+
        '<div class="cmd-total-label">A regler</div>'+
        '<div class="cmd-total-big">'+c.total+' €</div>'+
      '</div>'+
    '</div>'+
    '<div class="cmd-detail">'+
      '<div class="detail-title">Detail commande</div>'+
      parseArts(c.articles)+
    '</div>'+
    '<div class="cmd-action">'+
      '<button class="btn-paye" onclick="paye(\''+c.num+'\')">Paye — Remettre la commande</button>'+
    '</div>';
  return div;
}

function parseArts(str){
  if(!str)return '<div style="font-size:0.78rem;color:#bbb;font-style:italic;">Aucun detail</div>';
  var parts=str.split(' | ');
  var html='';
  parts.forEach(function(part){
    var d=part.indexOf(' - ');
    var name=d>=0?part.substring(0,d).trim():part.trim();
    var opts=d>=0?part.substring(d+3).trim():'';
    var nl=name.toLowerCase();
    var img='';
    if(nl.indexOf('menu')>=0)img=IMGS.menu;
    else if(nl.indexOf('hot')>=0)img=IMGS.hotdog;
    else if(nl.indexOf('frite')>=0)img=IMGS.frites;
    else if(nl.indexOf('crep')>=0)img=IMGS.crepe;
    html+='<div class="art-ligne">';
    html+='<img class="art-img" src="'+img+'" alt=""/>';
    html+='<div class="art-info"><div class="art-name">'+name+'</div>';
    if(opts){
      var ol=opts.split(', ');
      html+='<div class="art-opts">';
      ol.forEach(function(o){
        o=o.trim().replace(/[✓]/g,'').trim();
        var cl='opt-def';var lo=o.toLowerCase();
        if(lo==='ketchup')cl='opt-k';
        else if(lo==='mayo')cl='opt-m';
        else if(lo==='moutarde')cl='opt-mo';
        else if(lo==='cornichons')cl='opt-c';
        else if(lo.indexOf('oignon')>=0)cl='opt-o';
        else if(lo==='nutella')cl='opt-n';
        else if(lo==='sucre')cl='opt-s';
        html+='<span class="opt '+cl+'">'+o+'</span>';
      });
      html+='</div>';
    }
    html+='</div></div>';
  });
  return html;
}

function paye(num){
  if(!cmds[num])return;
  cmds[num].statut='remis';cmds[num].lc=true;
  render();
  fetch(URL+'?action=statut&numero='+encodeURIComponent(num)+'&statut=remis')
    .then(function(r){return r.json();})
    .then(function(){setTimeout(function(){if(cmds[num])cmds[num].lc=false;},5000);})
    .catch(function(){});
}
</script>
</body>
</html>
